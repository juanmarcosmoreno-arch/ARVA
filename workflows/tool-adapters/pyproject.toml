[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arva-tools"
version = "0.2.0"
description = "ARVA tool adapters: discovery, versioning and safe execution of external bioinformatics tools"
requires-python = ">=3.11"
dependencies = ["arva-core"]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["arva_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["B008", "E501", "UP042", "RUF001"]
