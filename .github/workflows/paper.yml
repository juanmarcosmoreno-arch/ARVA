# Builds the JOSS paper (paper/paper.md) into a PDF with the journal's own builder, so the draft can be read as JOSS
# will typeset it. The PDF is an artifact of the run ("paper"); nothing is committed.
name: Paper (JOSS draft PDF)

on:
  push:
    branches: [main, claude/affectionate-darwin-oknu0k]
    paths: [paper/**, .github/workflows/paper.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper
          path: paper/paper.pdf
