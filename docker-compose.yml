# ARVA local deployment. All ports bind to 127.0.0.1 only: ARVA is not exposed
# to the network by default. Open http://localhost:8080 after `docker compose up`.
name: arva

x-arva-env: &arva-env
  ARVA_DATABASE_URL: postgresql+psycopg://arva:${ARVA_DB_PASSWORD:-arva_local_only}@postgres:5432/arva
  ARVA_REDIS_URL: redis://redis:6379/0
  ARVA_STORAGE_ROOT: /data
  ARVA_CORS_ORIGINS: '["http://localhost:8080"]'

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: arva
      POSTGRES_PASSWORD: ${ARVA_DB_PASSWORD:-arva_local_only}
      POSTGRES_DB: arva
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arva -d arva"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: arva-api:0.1.0
    environment: *arva-env
    volumes:
      - ${ARVA_DATA_DIR:-arva-data}:/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  worker:
    image: arva-api:0.1.0
    command: ["python", "/opt/arva/apps/workers/run_worker.py"]
    environment: *arva-env
    volumes:
      - ${ARVA_DATA_DIR:-arva-data}:/data
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: arva-web:0.1.0
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  postgres-data:
  arva-data:
