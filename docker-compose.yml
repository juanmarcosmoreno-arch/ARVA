# ARVA local deployment. All ports bind to 127.0.0.1 only: ARVA is not exposed
# to the network by default. Open http://localhost:8080 after `docker compose up`.
name: arva

x-arva-env: &arva-env
  ARVA_DATABASE_URL: postgresql+psycopg://arva:${ARVA_DB_PASSWORD:-arva_local_only}@postgres:5432/arva
  ARVA_REDIS_URL: redis://redis:6379/0
  ARVA_STORAGE_ROOT: /data
  # Reference databases (Database Manager): a named volume, or a host folder with ARVA_DATABASES_DIR.
  ARVA_DB_DIR: /databases
  ARVA_CORS_ORIGINS: '["http://localhost:8080"]'
  # Host folder mounted read-only at /import for server-side import (see import/README.md).
  ARVA_IMPORT_ROOTS: '["/import"]'
  ARVA_MIN_FREE_BYTES: ${ARVA_MIN_FREE_BYTES:-1073741824}
  # Administrator caps on the performance profile (threads and memory per tool run); empty: no cap.
  ARVA_TOOL_THREADS: ${ARVA_TOOL_THREADS:-}
  ARVA_TOOL_MEMORY_GB: ${ARVA_TOOL_MEMORY_GB:-}
  # Facts about the computer, set by scripts/start.sh on a Mac (sysctl, system_profiler, sw_vers, docker info) so that
  # ARVA can choose a performance profile. Empty with a plain `docker compose up`: the computer is then unknown and
  # the profile follows the CPUs and memory the containers can use.
  ARVA_HOST_PLATFORM: ${ARVA_HOST_PLATFORM:-}
  ARVA_HOST_MODEL_NAME: ${ARVA_HOST_MODEL_NAME:-}
  ARVA_HOST_MODEL_ID: ${ARVA_HOST_MODEL_ID:-}
  ARVA_HOST_CHIP: ${ARVA_HOST_CHIP:-}
  ARVA_HOST_PERF_CORES: ${ARVA_HOST_PERF_CORES:-}
  ARVA_HOST_EFF_CORES: ${ARVA_HOST_EFF_CORES:-}
  ARVA_HOST_PHYSICAL_CORES: ${ARVA_HOST_PHYSICAL_CORES:-}
  ARVA_HOST_LOGICAL_CPUS: ${ARVA_HOST_LOGICAL_CPUS:-}
  ARVA_HOST_MEMORY_BYTES: ${ARVA_HOST_MEMORY_BYTES:-}
  ARVA_HOST_OS_VERSION: ${ARVA_HOST_OS_VERSION:-}
  ARVA_HOST_ARCH: ${ARVA_HOST_ARCH:-}
  ARVA_HOST_DOCKER_CPUS: ${ARVA_HOST_DOCKER_CPUS:-}
  ARVA_HOST_DOCKER_MEMORY_BYTES: ${ARVA_HOST_DOCKER_MEMORY_BYTES:-}

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: arva
      POSTGRES_PASSWORD: ${ARVA_DB_PASSWORD:-arva_local_only}
      POSTGRES_DB: arva
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arva -d arva"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    image: arva-api:0.2.0
    environment: *arva-env
    volumes:
      - ${ARVA_DATA_DIR:-arva-data}:/data
      - ${ARVA_DATABASES_DIR:-arva-databases}:/databases
      - ${ARVA_IMPORT_DIR:-./import}:/import:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  worker:
    image: arva-api:0.2.0
    command: ["python", "/opt/arva/apps/workers/run_worker.py"]
    environment: *arva-env
    volumes:
      - ${ARVA_DATA_DIR:-arva-data}:/data
      - ${ARVA_DATABASES_DIR:-arva-databases}:/databases
      - ${ARVA_IMPORT_DIR:-./import}:/import:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: arva-web:0.2.0
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

volumes:
  postgres-data:
  arva-data:
  arva-databases:
