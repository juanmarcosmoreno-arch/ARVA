# Only requests addressed to this computer are answered: a hostile domain that re-resolves to 127.0.0.1 (DNS
# rebinding) gets no response. The API checks Host and Origin as well (apps/api/app/api/local_origin.py).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;

    # Sequencing files can be many gigabytes: stream uploads straight to the API.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location /api/ {
        # HTTP/1.1 lets nginx stream request bodies instead of buffering chunked ones to disk.
        proxy_http_version 1.1;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    location / {
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri /index.html;
    }
}
